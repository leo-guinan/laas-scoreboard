name: Update experiment scoreboard

on:
  schedule:
    - cron: "*/15 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Update aggregates
        env:
          FATHOM_API_KEY: ${{ secrets.FATHOM_API_KEY }}
          STRIPE_SECRET_KEY: ${{ secrets.STRIPE_SECRET_KEY }}
        run: python3 scripts/update_scoreboard.py
      - name: Commit updated scoreboard
        run: |
          if git diff --quiet -- data/scoreboard.json; then
            echo "No scoreboard changes."
            exit 0
          fi
          git config user.name "laas-scoreboard-bot"
          git config user.email "actions@users.noreply.github.com"
          git add data/scoreboard.json
          git commit -m "Update experiment scoreboard"
          git push
